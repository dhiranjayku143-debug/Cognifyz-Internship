<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" id="authBox">
    <h1 id="authTitle">Login</h1>
    <form id="authForm">
      <input type="text" id="username" placeholder="Username" style="display:none;">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" id="authBtn">Login</button>
    </form>
    <p id="authMsg"></p>
    <p><a href="#" id="switchLink">Don't have an account? Sign up</a></p>
  </div>

  <div class="container" id="taskBox" style="display:none;">
    <h1>Task Manager</h1>
    <p>Welcome, <strong id="welcome"></strong> | <a href="#" id="logoutLink">Logout</a></p>
    <form id="taskForm">
      <input type="text" id="taskInput" placeholder="Write a new task...">
      <button type="submit">Add</button>
    </form>
    <p id="message"></p>
    <p id="quote" style="font-style: italic; color: #555;"></p>
    <ul id="taskList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
